name: macOS Developer ID draft release

on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: Exact macos-release commit SHA, matching the caller's uses pin
        required: true
        type: string
      expected-repository:
        description: Official caller repository in Beastry/name form
        required: true
        type: string
      tag:
        description: Release version/tag name; this workflow never creates a git tag
        required: true
        type: string
      package-command:
        description: Trusted caller bash command; signs and packages into dmg-path
        default: ''
        type: string
      dmg-path:
        description: Relative path or glob inside the caller checkout, exactly one DMG
        default: dist/*.dmg
        type: string
      app-relative-path:
        description: Optional app path relative to the mounted DMG root
        default: ''
        type: string
      already-notarized:
        description: Caller already notarized and stapled the DMG; validate rather than submit
        default: false
        type: boolean
      hardware-requirements:
        description: Optional Sparkle hardwareRequirements, such as arm64
        default: ''
        type: string
      runner-label:
        description: Org GitHub Actions-hosted Xcode runner label
        default: xcode-27
        type: string
      dry-run:
        description: Run no-secret validation only; never package, notarize, or create a release
        default: false
        type: boolean
    secrets:
      DEVELOPER_ID_P12_BASE64:
        required: false
      DEVELOPER_ID_P12_PASSWORD:
        required: false
      DEVELOPER_ID_IDENTITY:
        required: false
      APPLE_TEAM_ID:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      ASC_API_KEY_ID:
        required: false
      ASC_API_ISSUER_ID:
        required: false
      ASC_API_KEY_P8_BASE64:
        required: false
      SPARKLE_ED_PRIVATE_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate trust boundary
        env:
          TOOLKIT_REF: ${{ inputs.toolkit-ref }}
          EXPECTED_REPOSITORY: ${{ inputs.expected-repository }}
          DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PACKAGE_COMMAND: ${{ inputs.package-command }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TOOLKIT_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          if [[ "$DRY_RUN" != true ]]; then
            [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
            [[ "$GITHUB_REPOSITORY" =~ ^Beastry/[A-Za-z0-9_.-]+$ ]]
            [[ -n "$PACKAGE_COMMAND" ]]
            case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
              workflow_dispatch:refs/heads/"$DEFAULT_BRANCH"|push:refs/heads/"$DEFAULT_BRANCH") ;;
              push:refs/tags/"$RELEASE_TAG") ;;
              *) echo 'Real releases require default-branch dispatch/push or a matching trusted tag push.' >&2; exit 1 ;;
            esac
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: ${{ !inputs.dry-run }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require source on the default branch
        id: source
        if: ${{ !inputs.dry-run }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  dry-run:
    needs: guard
    if: ${{ inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Beastry/macos-release
          ref: ${{ inputs.toolkit-ref }}
          persist-credentials: false
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python scripts/validate.py

  package:
    needs: guard
    if: ${{ !inputs.dry-run && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 120
    env:
      XCODE_APP: /Applications/Xcode_27.app
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.guard.outputs.source-sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Beastry/macos-release
          ref: ${{ inputs.toolkit-ref }}
          path: .macos-release
          persist-credentials: false
      - name: Prepare tools and refuse published release
        run: |
          set -euo pipefail
          if [[ -d "$XCODE_APP" ]]; then sudo xcode-select -s "$XCODE_APP"; fi
          xcrun --find notarytool >/dev/null
          python3 -m venv .macos-release/.venv
          .macos-release/.venv/bin/python -m pip install -r .macos-release/requirements.txt
          printf 'RELEASE_PYTHON=%s/.macos-release/.venv/bin/python\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          .macos-release/.venv/bin/python .macos-release/scripts/release.py preflight
      - name: Import ephemeral signing credentials
        uses: ./.macos-release/.github/actions/import-signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      - name: Run trusted caller packaging command
        working-directory: source
        env:
          PACKAGE_COMMAND: ${{ inputs.package-command }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "$DEVELOPER_ID_IDENTITY" && -n "$APPLE_TEAM_ID" && -n "$ASC_API_KEY_ID" && -n "$ASC_API_ISSUER_ID" ]]
          bash --noprofile --norc -e -o pipefail -c "$PACKAGE_COMMAND"
      - name: Resolve packaged DMG
        env:
          DMG_PATTERN: ${{ inputs.dmg-path }}
        run: '"$RELEASE_PYTHON" .macos-release/scripts/resolve_dmg.py'
      - name: Inspect packaged app
        env:
          APP_RELATIVE_PATH: ${{ inputs.app-relative-path }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: '"$RELEASE_PYTHON" .macos-release/scripts/release.py inspect'
      - name: Notarize or validate caller notarization
        uses: ./.macos-release/.github/actions/notarize
        env:
          ALREADY_NOTARIZED: ${{ inputs.already-notarized }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      - name: Generate verified Sparkle feed and checksum
        uses: ./.macos-release/.github/actions/sparkle-appcast
        env:
          HARDWARE_REQUIREMENTS: ${{ inputs.hardware-requirements }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      - name: Always remove signing credentials
        if: ${{ always() }}
        uses: ./.macos-release/.github/actions/cleanup
      - name: Transfer only public release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_ASSETS_DIR }}
          if-no-files-found: error
          retention-days: 1

  draft:
    needs: [guard, package]
    if: ${{ !inputs.dry-run && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Beastry/macos-release
          ref: ${{ inputs.toolkit-ref }}
          path: .macos-release
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Prepare verifier
        run: |
          python3 -m venv .macos-release/.venv
          .macos-release/.venv/bin/python -m pip install -r .macos-release/requirements.txt
          printf 'RELEASE_PYTHON=%s/.macos-release/.venv/bin/python\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Create or update draft only
        uses: ./.macos-release/.github/actions/draft-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ needs.guard.outputs.source-sha }}
          RELEASE_ASSETS_DIR: ${{ github.workspace }}/release-assets
